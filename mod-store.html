<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mod Store · Modatorial.io</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
<link rel="apple-touch-icon" href="favicon.ico">

<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/client.css">

<style>
  html, body {
    margin: 0; padding: 0;
    height: 100%; width: 100%;
    overflow: hidden;
    background: #0F172A;
    color: #e6edf3;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  }

  /* Keep the standalone store above the game chrome created by modLoader.js. */
  #tt-store-modal {
    position: fixed !important;
    inset: 0 !important;
    z-index: 2147483647 !important;
    box-sizing: border-box !important;
  }

  /* ---- Auth / loading veil ---- */
  #tt-auth-veil {
    position: fixed; inset: 0;
    background: radial-gradient(circle at 50% 40%, #1a2740 0%, #0F172A 55%, #060a14 100%);
    z-index: 2000000;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px;
    color: #7d8590;
    font-family: system-ui, sans-serif; font-size: 14px;
    transition: opacity .35s ease;
    text-align: center;
    padding: 20px;
  }
  #tt-auth-veil.hidden { opacity: 0; pointer-events: none; }

  #tt-auth-veil .spinner {
    width: 36px; height: 36px; border-radius: 50%;
    border: 3px solid rgba(0,245,212,0.15);
    border-top-color: #00F5D4;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #tt-auth-veil .brand {
    font-weight: 800; font-size: 22px; letter-spacing: -.3px;
    color: #e6edf3; margin-bottom: 4px;
  }
  #tt-auth-veil .brand .badge {
    font-size: 10px; font-weight: 700; padding: 2px 8px; margin-left: 8px;
    border-radius: 10px; background: #00F5D4; color: #062a0d;
    vertical-align: middle;
  }
  #tt-auth-veil .err {
    color: #f85149; font-weight: 600; font-size: 15px;
  }
  #tt-auth-veil .err-detail {
    color: #8b949e; font-size: 12px; max-width: 480px;
    line-height: 1.5;
  }
</style>
</head>
<body>

<div id="tt-auth-veil">
  <div class="brand">⬢ Modatorial<span class="badge">STORE</span></div>
  <div class="spinner"></div>
  <div id="veil-msg">Checking sign-in…</div>
</div>

<!-- ============================================================
     Firebase SDK (compat — matches the current auth.js)
     ============================================================ -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<!-- Firebase config (auto-initializes the compat SDK) -->
<script src="firebase-config.js"></script>

<!-- Auth wrapper — exposes window.Auth -->
<script src="auth.js"></script>

<!-- Store dependencies -->
<script src="promo-codes.js"></script>
<script src="ttmod-translator.js"></script>
<script src="moddables.js"></script>

<!-- modLoader is needed so Store.install() can call
     TerritorialMods.importTtmodFile(...) -->
<script src="modLoader.js"></script>

<!-- The store itself (patched with openInline) -->
<script src="mod-store.js"></script>

<script>
(async () => {
  'use strict';

  /* Mark this page as "standalone store" so mod-store.js knows to
     navigate back to game.html instead of hiding the modal. */
  document.body.dataset.ttStandalone = '1';

  const veil   = document.getElementById('tt-auth-veil');
  const veilMsg = document.getElementById('veil-msg');

  function setMsg(msg)  { if (veilMsg) veilMsg.textContent = msg; }
  function veilFail(title, detail) {
    if (!veil) return;
    veil.innerHTML =
      '<div class="brand">⬢ Modatorial<span class="badge">STORE</span></div>' +
      '<div class="err">' + title + '</div>' +
      (detail ? '<div class="err-detail">' + detail + '</div>' : '') +
      '<div style="margin-top:10px">' +
        '<a href="game.html" style="color:#00F5D4;text-decoration:none;font-weight:600">' +
          '← Back to game' +
        '</a>' +
      '</div>';
  }

  /* ---- 0. Sanity check ---- */
  if (typeof firebase === 'undefined') {
    veilFail('Firebase SDK failed to load',
             'Check your internet connection or an ad-blocker blocking gstatic.com.');
    return;
  }
  if (!window.MODATORIAL_FIREBASE || !window.MODATORIAL_FIREBASE.apiKey) {
    veilFail('Firebase is not configured',
             'Open firebase-config.js and paste your real values from the Firebase Console.');
    return;
  }

  /* ---- 1. Wait for Auth to become ready ---- */
  function waitForAuth(timeoutMs) {
    return new Promise(resolve => {
      if (window.Auth && window.Auth.ready) return resolve(window.Auth.current());
      const start = Date.now();
      const iv = setInterval(() => {
        if (window.Auth && window.Auth.ready) {
          clearInterval(iv);
          resolve(window.Auth.current());
        } else if (Date.now() - start > (timeoutMs || 7000)) {
          clearInterval(iv);
          console.warn('[ModStore] Auth did not become ready in time');
          resolve(window.Auth ? window.Auth.current() : null);
        }
      }, 80);
    });
  }

  const user = await waitForAuth();

  /* Dev escape hatch — same as game.html */
  const skipAuth =
    (location.hostname === 'localhost' || location.hostname === '127.0.0.1') &&
    new URLSearchParams(location.search).has('skipauth');

  if (!user && !skipAuth) {
    try { sessionStorage.setItem('tt-auth-return', 'mod-store.html'); } catch {}
    location.replace('login.html?next=' + encodeURIComponent('mod-store.html'));
    return;
  }

  /* ---- 2. Wait for ModStore to be defined ---- */
  setMsg('Loading store…');
  let tries = 0;
  while (typeof window.ModStore === 'undefined' && tries < 100) {
    await new Promise(r => setTimeout(r, 40));
    tries++;
  }
  if (!window.ModStore) {
    veilFail('mod-store.js failed to load',
             'Check the file exists and has no syntax errors in DevTools → Console.');
    return;
  }

  /* ---- 3. Open the store inline ---- */
  try {
    window.ModStore.openInline();
    if (veil) veil.classList.add('hidden');
  } catch (e) {
    console.error('[ModStore] openInline failed:', e);
    veilFail('Could not open the store', (e && e.message) || String(e));
  }

})();
</script>
</body>
</html>
