<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Modatorial.io</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/splash.css">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
<link rel="apple-touch-icon" href="favicon.ico">
</head>
<body>

<div id="stage">
  <div id="pano"></div>
  <div id="vig"></div>

  <img id="splash-logo" src="assets/logo.png" alt="Modatorial" />

  <div id="letters"></div>

  <div id="menu">
    <button id="btn-play">▶  Play</button>
    <button id="btn-account" class="secondary">🧑  My Account</button>
    <button id="btn-credits" class="secondary">🎬  Credits</button>
    <button id="btn-readme"  class="secondary">📖  Readme</button>
  </div>
</div>

<div id="flash"></div>
<div id="skip">press any key to skip</div>

<!-- Credits modal -->
<div class="modal" id="modal-credits">
  <div class="modal-inner">
    <button class="modal-close" data-close>✕</button>
    <h2>🎬 Credits</h2>
    <h3>Modatorial.io</h3>
    <p>A modded client for <strong>Territorial.io</strong>.</p>
    <h3>Original Game</h3>
    <p><strong>Territorial.io</strong> — by <strong>David Tschacher</strong>.<br>
    <a href="https://territorial.io" target="_blank">territorial.io</a></p>
    <h3>Team</h3>
    <ul>
      <li><strong>Pakball13</strong> — Founder · Lead Developer</li>
      <li><strong>Roble Code</strong> — Bug Hunter · Contributor</li>
      <li><strong>ModderBoii</strong> — Logo &amp; SVG icons</li>
    </ul>
  </div>
</div>

<!-- Readme modal -->
<div class="modal" id="modal-readme">
  <div class="modal-inner">
    <button class="modal-close" data-close>✕</button>
    <h2>📖 Readme</h2>
    <pre id="readme-content">Loading…</pre>
  </div>
</div>

<script>
(() => {
  'use strict';

  const $letters   = document.getElementById('letters');
  const $pano      = document.getElementById('pano');
  const $menu      = document.getElementById('menu');
  const $flash     = document.getElementById('flash');
  const $logo      = document.getElementById('splash-logo');

  const START_TEXT = 'TERRITORIAL.IO';
  const FINAL_TEXT = 'MODATORIAL.IO';

  const wait = ms => new Promise(r => setTimeout(r, ms));

  let skipped = false;
  let menuShown = false;

  /* ============================================================
   * PANORAMA LOADER
   * ============================================================ */
  function loadPanorama() {
    const candidates = [
      'mods/panorama-bg/assets/panorama.png',
      'mods/panorama-bg/assets/panorama.jpg',
      'mods/panorama-bg/assets/panorama.jpeg',
      'mods/panorama-bg/assets/panorama.webp',
      'assets/panorama.png'
    ];
    let i = 0;
    const tryNext = () => {
      if (i >= candidates.length) {
        $pano.style.background =
          'radial-gradient(circle at 50% 40%, #1a1a3a 0%, #0a0a1a 55%, #3a1a4a 100%)';
        $pano.classList.add('loaded');
        return;
      }
      const url = candidates[i++];
      const img = new Image();
      img.onload  = () => {
        $pano.style.backgroundImage = `url("${url}")`;
        $pano.style.backgroundSize  = 'cover';
        $pano.style.backgroundPosition = 'center';
        $pano.classList.add('loaded');
      };
      img.onerror = tryNext;
      img.src = url;
    };
    tryNext();
  }

  /* ============================================================
   * LOGO HANDLING
   * ============================================================ */
  function logoReady() {
    return $logo && $logo.complete && $logo.naturalWidth > 0;
  }
  if ($logo) {
    $logo.addEventListener('error', () => {
      $logo.style.display = 'none';
      if ($letters) $letters.style.top = '50%';
    });
  }

  /* ============================================================
   * SKIP HANDLERS
   * ============================================================ */
  function skipAll() {
    if (skipped) return;
    skipped = true;
    showFinalMenu();
  }
  window.addEventListener('keydown', skipAll);
  window.addEventListener('mousedown', skipAll);

  /* ============================================================
   * ANIMATION
   * ============================================================ */
  async function animate() {
    try {
      await wait(300);
      if (skipped) return;

      /* ---- PHASE 1 : letters fall from sky ---- */
      $letters.innerHTML = '';
      for (const ch of START_TEXT) {
        const s = document.createElement('span');
        s.textContent = ch === ' ' ? '\u00A0' : ch;
        const xJit = (Math.random() - 0.5) * 40;
        const rot  = (Math.random() - 0.5) * 12;
        s.style.transform  = `translate(${xJit}px, -600px) rotate(${rot}deg)`;
        s.style.transition = 'none';
        $letters.appendChild(s);
      }
      void $letters.offsetWidth;   /* force reflow */

      [...$letters.children].forEach((s, i) => {
        const d = 60 + i * 45 + Math.random() * 120;
        setTimeout(() => {
          s.style.transition = 'opacity 0.35s ease, transform 0.85s cubic-bezier(0.22, 1.4, 0.36, 1)';
          s.style.opacity    = '1';
          s.style.transform  = 'translate(0, 0) rotate(0deg)';
        }, d);
      });

      await wait(1900);
      if (skipped) return;

      /* ---- PHASE 2 : morph to MODATORIAL.IO ---- */
      [...$letters.children].forEach((s, i) => {
        setTimeout(() => {
          s.style.transition = 'opacity 0.35s, transform 0.35s';
          s.style.opacity    = '0';
          s.style.transform  = 'translateY(-30px) scale(0.5)';
        }, i * 25);
      });
      await wait(500);
      $letters.innerHTML = '';

      for (const ch of FINAL_TEXT) {
        const s = document.createElement('span');
        s.textContent = ch === ' ' ? '\u00A0' : ch;
        s.style.opacity = '0';
        s.style.transform = 'translateY(60px) scale(0.4)';
        s.style.transition = 'none';
        $letters.appendChild(s);
      }
      void $letters.offsetWidth;
      [...$letters.children].forEach((s, i) => {
        const d = 40 + i * 40;
        setTimeout(() => {
          s.style.transition = 'opacity 0.3s, transform 0.55s cubic-bezier(0.22, 1.5, 0.36, 1)';
          s.style.opacity    = '1';
          s.style.transform  = 'translateY(0) scale(1)';
        }, d);
      });

      await wait(1100);
      if (skipped) return;

      /* ---- PHASE 3 : logo fades in ---- */
      if (logoReady()) {
        $logo.classList.add('show');
        await wait(700);
        if (skipped) return;
      }

      /* ---- PHASE 4 : panorama fades in ---- */
      loadPanorama();
      await wait(1100);
      if (skipped) return;

      /* ---- PHASE 5 : glow + flash ---- */
      [...$letters.children].forEach((s, i) => {
        setTimeout(() => {
          s.style.transition  = 'color 0.4s, text-shadow 0.6s';
          s.style.color       = '#fff';
          s.style.textShadow  = '0 0 18px #fff, 0 0 40px #aaf, 0 0 90px #7af';
        }, i * 30);
      });
      if (logoReady()) {
        $logo.style.filter = 'drop-shadow(0 0 40px #fff) drop-shadow(0 0 80px #7af)';
      }
      await wait(650);
      if (skipped) return;

      $flash.style.opacity = '0.95';
      await wait(220);
      $flash.style.opacity = '0';
      await wait(220);
      if (skipped) return;

      /* ---- PHASE 6 : fade to black ---- */
      [...$letters.children].forEach((s, i) => {
        setTimeout(() => {
          s.style.transition = 'opacity 0.7s';
          s.style.opacity    = '0';
        }, i * 25);
      });
      if (logoReady()) {
        $logo.style.transition = 'opacity 0.7s';
        $logo.style.opacity    = '0';
      }
      $pano.classList.add('fade-out');

      await wait(1200);

    } catch (e) {
      console.error('[Splash] Animation error:', e);
    }

    /* ALWAYS show the menu, no matter what happened */
    if (!skipped) showFinalMenu();
  }

  function showFinalMenu() {
    if (menuShown) return;
    menuShown = true;

    try { $letters.innerHTML = ''; } catch {}

    try {
      $pano.classList.remove('loaded');
      $pano.classList.add('fade-out');
      $pano.style.backgroundImage = 'none';
      $pano.style.background = '#000';
    } catch {}

    try {
      if ($logo) { $logo.classList.remove('show'); $logo.style.opacity = '0'; }
    } catch {}

    /* Show the menu */
    try { $menu.classList.add('show'); } catch {}
    try { document.getElementById('skip').style.opacity = '0'; } catch {}

    console.log('[Splash] Menu shown');
  }

  /* ============================================================
   * FALLBACK: force menu after 12s no matter what
   * ============================================================ */
  setTimeout(() => {
    if (!menuShown) {
      console.warn('[Splash] Animation timeout — forcing menu');
      showFinalMenu();
    }
  }, 12000);

  /* ============================================================
   * BUTTON HANDLERS
   * ============================================================ */
  document.getElementById('btn-play').addEventListener('click', () => {
    console.log('[Splash] Play clicked → game.html');
    document.body.style.transition = 'opacity 0.45s';
    document.body.style.opacity = '0';
    setTimeout(() => { location.href = 'game.html'; }, 450);
  });

  document.getElementById('btn-account').addEventListener('click', () => {
    console.log('[Splash] Account clicked → account.html');
    location.href = 'account.html';
  });

  document.getElementById('btn-credits').addEventListener('click', () => {
    document.getElementById('modal-credits').classList.add('show');
  });

  document.getElementById('btn-readme').addEventListener('click', async () => {
    const modal = document.getElementById('modal-readme');
    const pre   = document.getElementById('readme-content');
    modal.classList.add('show');
    pre.textContent = 'Loading…';

    const sources = ['MODDING.md', 'README.md', 'readme.md', 'Readme.md'];
    let loaded = false;
    for (const src of sources) {
      try {
        const r = await fetch(src, { cache: 'no-store' });
        if (!r.ok) continue;
        pre.textContent = await r.text();
        loaded = true;
        break;
      } catch {}
    }
    if (!loaded) {
      pre.textContent =
        'No MODDING.md or README.md found in the project root.\n\n' +
        'Create one of those files next to index.html and it will be shown here.';
    }
  });

  document.querySelectorAll('[data-close]').forEach(b => {
    b.addEventListener('click', () => b.closest('.modal').classList.remove('show'));
  });
  document.querySelectorAll('.modal').forEach(m => {
    m.addEventListener('click', e => { if (e.target === m) m.classList.remove('show'); });
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape')
      document.querySelectorAll('.modal.show').forEach(m => m.classList.remove('show'));
  });

  /* ============================================================
   * GO
   * ============================================================ */
  animate();
})();
</script>
</body>
</html>
